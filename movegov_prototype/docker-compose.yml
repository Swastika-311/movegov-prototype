services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movegov
      POSTGRES_PASSWORD: movegov
      POSTGRES_DB: movegov
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movegov -d movegov"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://movegov:movegov@db:5432/movegov
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
